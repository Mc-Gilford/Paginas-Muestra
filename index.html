<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imágenes en fila</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    section {
      display: flex;
      flex-direction: row;
    }
    section img {
      width: 400px;   /* ancho fijo de cada imagen */
      height: auto;   /* mantiene proporción */
      margin: 0;      /* sin separación */
      padding: 0;
      display: block;
    }
  </style>
</head>
<body>
  <section>
    <img src="guerre (1).png" alt="Imagen 1">
    <img src="guerre (2).png" alt="Imagen 2">
    <img src="guerre (3).png" alt="Imagen 3">
    <img src="guerre (4).png" alt="Imagen 4">
    <img src="guerre (5).png" alt="Imagen 5">
    <img src="guerre (6).png" alt="Imagen 6">
    <img src="guerre (7).png" alt="Imagen 7">
  </section>
</body>
</html>
